<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Попова Елена — риелтор в Соликамске · жилая недвижимость</title>
  <meta name="description" content="Попова Елена — частный риелтор в Соликамске. Покупка, продажа и инвестиции в жилую недвижимость. Звоните: +7 (952) 32-82-858">

  <meta property="og:title" content="Попова Елена — риелтор в Соликамске">
  <meta property="og:description" content="Жилая недвижимость в Соликамске. Покупка, продажа, инвестиции.">
  <meta property="og:image" content="Elena.jpg">
  <meta property="og:type" content="profile">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d12;
      --bg-soft:   #11141b;
      --line:      rgba(255,255,255,0.08);
      --text:      #f1ece3;
      --muted:     #8a857a;
      --gold:      #c9a574;
      --gold-soft: #e0bc8a;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow-x: hidden;
    }

    /* Очень мягкое золотое свечение — единственный декоративный элемент */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 0%, rgba(201, 165, 116, 0.10), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(201, 165, 116, 0.06), transparent 55%);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 5fr 7fr;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      animation: fadeIn 0.6s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Колонка с фото */
    .photo {
      position: relative;
      background-image: url("Elena.jpg");
      background-size: cover;
      background-position: center 25%;
      min-height: 100%;
    }
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(11,13,18,0) 60%, rgba(11,13,18,0.55) 100%);
    }

    /* Колонка с информацией */
    .info {
      padding: 44px 44px 40px;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 18px;
    }
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .name {
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 14px;
    }

    .tagline {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 38ch;
    }

    /* Список контактов */
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 32px;
      list-style: none;
    }
    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      margin: 0 -14px;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .contact:hover {
      background: rgba(201, 165, 116, 0.07);
      color: var(--gold-soft);
    }
    .contact .ic {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(201, 165, 116, 0.10);
      color: var(--gold);
    }
    .contact:hover .ic {
      background: rgba(201, 165, 116, 0.18);
    }
    .contact .ic svg {
      width: 17px; height: 17px;
      fill: currentColor;
    }
    .contact .label {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .contact .label-top {
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .contact .label-value {
      font-weight: 500;
      letter-spacing: 0.1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Главная кнопка */
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      background: var(--gold);
      color: #1a1408;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      letter-spacing: 0.2px;
      transition: background 0.2s ease, transform 0.2s ease;
      align-self: flex-start;
    }
    .cta:hover {
      background: var(--gold-soft);
      transform: translateY(-1px);
    }
    .cta:active { transform: translateY(0); }
    .cta svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* MOBILE */
    @media (max-width: 720px) {
      body { padding: 0; align-items: stretch; }
      .card {
        grid-template-columns: 1fr;
        border-radius: 0;
        border: none;
        min-height: 100vh;
        box-shadow: none;
      }
      .photo {
        aspect-ratio: 5 / 4;
        min-height: 0;
        background-position: center 22%;
      }
      .photo::after {
        background: linear-gradient(180deg, rgba(11,13,18,0) 55%, rgba(11,13,18,0.85) 100%);
      }
      .info {
        padding: 28px 24px 36px;
      }
      .tagline { margin-bottom: 24px; }
      .contacts { margin-bottom: 24px; }
      .cta { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
