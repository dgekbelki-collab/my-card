<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QR — открой визитку на телефоне</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(120deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: rgba(255,255,255,0.55); margin-bottom: 24px; text-align: center; }
    .qr-box {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(124,58,237,0.3);
    }
    .qr-box img { display: block; width: 320px; height: 320px; }
    .url {
      margin-top: 20px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-family: monospace;
      font-size: 14px;
      color: #a78bfa;
    }
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      max-width: 400px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Сканируй с телефона</h1>
  <p>Телефон должен быть в той же Wi-Fi сети</p>

  <div class="qr-box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=http://192.168.1.184:8000/vizitka.html" alt="QR">
  </div>

  <div class="url">http://192.168.1.184:8000/vizitka.html</div>

  <div class="hint">
    Если не открывается — проверь, что компьютер и телефон в одной Wi-Fi сети,
    и что Windows Firewall разрешает входящие соединения на порт 8000.
  </div>
</body>
</html>
